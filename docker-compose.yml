version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: arcivo-postgres
    restart: always
    environment:
      POSTGRES_USER: arcivo_user
      POSTGRES_PASSWORD: arcivo_password
      POSTGRES_DB: arcivo_db
    ports:
      - "5432:5432"
    volumes:
      - arcivo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcivo_user -d arcivo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  arcivo_pgdata:
    driver: local

